name: rasanusantara
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^6.1.1
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.2.2
  timezone: ^0.9.4
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/recipes/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFF2CF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_native_splash:
  color: "#C98553"
  image: assets/images/loading.png
  android: true
  ios: true